<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Accounting</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
</head>
<body class="auth-page">
<div class="auth-card" data-aos="zoom-in">
<div class="auth-header">
<a class="logo" href="index.html" style="justify-content:center;"><i class="fa-solid fa-chart-pie"></i></a>
<h2 style="margin-top:1.5rem; margin-bottom:0.5rem; font-size:1.75rem;">Welcome Back</h2>
<p style="color:var(--text-light); margin:0;">Sign in to securely manage your finances</p>
</div>
<form id="proLoginForm" novalidate="novalidate">
<div class="form-group">
<label class="form-label" for="loginEmail">Email Address</label>
<input class="form-control" id="loginEmail" placeholder="name@company.com" type="email"/><span class="error-message" id="loginEmailError"></span>

</div>
<div class="form-group">
<label class="form-label" for="loginPassword">Password</label>
<div style="position:relative;">
<input class="form-control" fa-circle"="" fa-solid="" id="loginPassword" placeholder="&lt;i class=" style="font-size:0.4em; vertical-align:middle; margin:0 6px;" type="password"/><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i>" style="padding-right:2.5rem;"&gt;
                    <i class="fa-solid fa-eye" id="togglePassword" style="position:absolute; right:1rem; top:50%; transform:translateY(-50%); cursor:pointer; color:var(--text-light); padding:0.25rem;"></i>
</div><span class="error-message" id="loginPasswordError"></span>

</div>
<div class="form-group">
<label class="form-label" for="loginRole">Select Role</label>
<select class="form-control" id="loginRole">
<option value="client">Client Portal</option>
<option value="admin">Admin Dashboard</option>
</select><span class="error-message" id="loginRoleError"></span>
</div>
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; font-size:0.95rem;">
<label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer; color:var(--text-main);">
<input id="dynamicField_login_1" style="width:16px; height:16px; accent-color:var(--accent);" type="checkbox"/><span class="error-message" id="dynamicField_login_1Error"></span> Remember me
                </label>
<a href="404.html" style="font-weight:600; color:var(--accent);">Forgot Password?</a>
</div>
<button class="btn btn-primary btn-block" id="loginSubmitBtn" style="padding:1rem; font-size:1.1rem; justify-content:center;" type="submit">Sign In</button>
</form>
<p style="text-align:center; margin-top:2.5rem; font-size:0.95rem; color:var(--text-light);">
            Don't have an account? <a href="signup.html" style="font-weight:700; color:var(--primary);">Sign Up</a>
</p>
</div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/main.js"></script>
</body>
</html>
