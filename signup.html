<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account | Accounting</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
</head>
<body class="auth-page">
<div class="auth-card" data-aos="zoom-in" style="max-width: 550px;">
<div class="auth-header">
<a class="logo" href="index.html" style="justify-content:center;"><i class="fa-solid fa-chart-pie"></i></a>
<h2 style="margin-top:1.5rem; margin-bottom:0.5rem; font-size:1.75rem;">Create an Account</h2>
<p style="color:var(--text-light); margin:0;">Join us to gain absolute financial clarity.</p>
</div>
<!-- Success Message Block -->
<div id="signupSuccess" style="display:none; padding:1.25rem; background:rgba(16,185,129,0.1); color:#059669; border-radius:var(--radius); margin-bottom:1.5rem; border:1px solid rgba(16,185,129,0.3); text-align:center;">
<i class="fa-solid fa-circle-check" style="font-size:1.5rem; margin-bottom:0.5rem;"></i>
<h4 style="margin:0; font-size:1.1rem;">Account Created!</h4>
<p style="margin:0; font-size:0.95rem;">Redirecting to login...</p>
</div>
<form id="proSignupForm" novalidate="novalidate">
<div class="form-group">
<label class="form-label" for="sName">Full Name</label>
<input class="form-control" id="sName" placeholder="John Doe" type="text"/><span class="error-message" id="sNameError"></span>

</div>
<div class="form-group">
<label class="form-label" for="sEmail">Email ID</label>
<input class="form-control" id="sEmail" placeholder="john@example.com" type="email"/><span class="error-message" id="sEmailError"></span>

</div>
<div class="form-group">
<label class="form-label" for="sRole">Select Role</label>
<select class="form-control" id="sRole">
<option value="client">Client</option>
<option value="admin">Admin</option>
</select><span class="error-message" id="sRoleError"></span>
</div>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem;">
<div class="form-group">
<label class="form-label" for="sPassword">Password</label>
<input class="form-control" fa-circle"="" fa-solid="" id="sPassword" placeholder="&lt;i class=" style="font-size:0.4em; vertical-align:middle; margin:0 6px;" type="password"/><span class="error-message" id="sPasswordError"></span><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i>"&gt;
                    
</div>
<div class="form-group">
<label class="form-label" for="sConfirmPassword">Confirm Password</label>
<input class="form-control" fa-circle"="" fa-solid="" id="sConfirmPassword" placeholder="&lt;i class=" style="font-size:0.4em; vertical-align:middle; margin:0 6px;" type="password"/><span class="error-message" id="sConfirmPasswordError"></span><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i><i class="fa-solid fa-circle" style="font-size:0.4em; vertical-align:middle; margin:0 6px;"></i>"&gt;
                    
</div>
</div>
<p style="font-size:0.85rem; color:var(--text-light); margin-bottom:1.5rem;">By signing up, you agree to our <a href="services.html" style="color:var(--accent); font-weight:600;">Terms of Service</a> and <a href="404.html" style="color:var(--accent); font-weight:600;">Privacy Policy</a>.</p>
<button class="btn btn-primary btn-block" id="signupSubmitBtn" style="padding:1rem; font-size:1.1rem; justify-content:center;" type="submit">Create Account</button>
</form>
<p style="text-align:center; margin-top:2.5rem; font-size:0.95rem; color:var(--text-light);">
            Already have an account? <a href="login.html" style="font-weight:700; color:var(--primary);">Login</a>
</p>
</div>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/main.js"></script>
</body>
</html>
